<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Myxa.js: in a canvas of your own</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  body{font:17px/1.6 Georgia,serif;max-width:46rem;margin:3rem auto;padding:0 1.5rem;color:#2b2620;background:#f4efe6}
  .stage{position:relative;height:360px;border-radius:10px;overflow:hidden;background:#e4d9c6}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<h1>In a canvas of your own</h1>
<p>Pass <code>canvas</code> and the animals live inside it instead of over the whole page.
The pointer still spooks the fly, in the canvas's own coordinates.</p>
<div class="stage"><canvas id="stage"></canvas></div>
<p>Scroll the page: the box moves, and the fly's idea of where the pointer is moves with it.</p>
<div style="height:120vh"></div>
<script type="module">
  import { Myxa } from '../src/index.js';
  window.toy = Myxa.start({ canvas: document.getElementById('stage'), ignoreReducedMotion: true });
</script>
</body>
</html>
